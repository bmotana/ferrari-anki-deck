[project]
name = "ferrari-anki-decks"
version = "0.1.0"
description = "Scrape Ferrari road-car data into Anki-ready and Kaggle-ready CSV files."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Bafana Motana" }]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/bmotana/ferrari-anki-deck"
Repository = "https://github.com/bmotana/ferrari-anki-deck"

[tool.ruff]
# Target Python version
target-version = "py310"

# Set max line length to match common standards (default is 88)
line-length = 88

# Exclude common generated or external directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable recommended rules:
# E/W: Pycodestyle (errors/warnings)
# F: Pyflakes
# I: Isort (import sorting)
# B: flake8-bugbear
# UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

# Rules to ignore (if needed)
ignore = []

# Allow fix for all enabled rules (when using `ruff check --fix`)
fixable = ["ALL"]

[tool.ruff.format]
# Prefer double quotes over single quotes
quote-style = "double"

# Use spaces instead of tabs for indentation
indent-style = "space"
